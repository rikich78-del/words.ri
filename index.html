<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Words.pi">
    <link rel="apple-touch-icon" href="icon.png"> 
    <link rel="icon" href="icon.png">

    <title>Words.pi</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chalk: #edeae5;
            --ancient-bonsai: #73754c;
            --muted-olive: #7c7E73;
            --rosy-brown: #913834;
            --dove-grey: #686775;
            --mocha: #4B3935;
            --vanilla-cream: #F0E7D5;
            --warm-cream: #FAF3E0;
            --slate-grey: #708090;
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: #f8f8f8;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            color: var(--ancient-bonsai);
        }

        .header { font-size: 32px; margin: 10px 0; font-weight: 900; }

        .lang-menu { display: flex; gap: 8px; margin-bottom: 10px; }
        .lang-btn {
            padding: 6px 14px;
            border: 1.5px solid var(--ancient-bonsai);
            background: white;
            border-radius: 8px;
            font-family: inherit;
            color: var(--ancient-bonsai);
        }
        .lang-btn.active { background-color: #dcdcdc; }

        /* КАРТОЧКА */
        .card-container {
            width: 100%;
            max-width: 320px;
            height: 200px;
            perspective: 1000px;
            margin: 15px 0;
        }
        .card {
            width: 100%; height: 100%;
            position: relative;
            transition: 0.6s;
            transform-style: preserve-3d;
        }
        .card.flipped { transform: rotateY(180deg); }
        .front, .back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-radius: 20px;
            background-color: var(--chalk);
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--ancient-bonsai);
            padding: 20px;
            box-sizing: border-box;
        }
        .back { transform: rotateY(180deg); }
        .word-text { font-size: 34px; text-align: center; }

        .delete-btn { position: absolute; bottom: 10px; right: 10px; border: none; background: none; font-size: 20px; opacity: 0.5; }

        /* ПОЛЯ ВВОДА */
        .add-area { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        input { padding: 8px; width: 80px; border: 1px solid var(--ancient-bonsai); border-radius: 8px; font-family: inherit; background: var(--chalk); }

        /* ТЕТРАДИ */
        .notebook {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .notebook-content {
            flex-grow: 1;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        /* ПОЛЕ С ЦВЕТНЫМ ТЕКСТОМ */
        .editor {
            width: 100%;
            height: 100%;
            outline: none;
            font-size: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .markers { display: flex; gap: 15px; margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.3); border-radius: 20px; justify-content: center; }
        .marker { width: 35px; height: 35px; border-radius: 50%; border: 2px solid white; cursor: pointer; }

        .close-btn { align-self: flex-end; color: white; font-size: 30px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">words.pi</div>

    <div class="lang-menu">
        <button class="lang-btn active" id="l-en" onclick="setLang('en')">Eng</button>
        <button class="lang-btn" id="l-kr" onclick="setLang('kr')">Kor</button>
        <button class="lang-btn" id="l-de" onclick="setLang('de')">Ger</button>
    </div>

    <div class="card-container" onclick="handleCardClick(event)">
        <div class="card" id="card-inner">
            <div class="front"><div class="word-text" id="f">Word</div></div>
            <div class="back">
                <div class="word-text" id="b">Слово</div>
                <button class="delete-btn" onclick="deleteWord(event)">🗑️</button>
            </div>
        </div>
    </div>

    <div class="add-area">
        <span onclick="openBook('rules')" style="font-size:30px">📌</span>
        <span onclick="openBook('notes')" style="font-size:30px">📄</span>
        <input id="in-f" placeholder="word">
        <input id="in-b" placeholder="transl.">
        <button class="lang-btn" onclick="add()">+</button>
    </div>

    <div id="rules-book" class="notebook" style="background-color: var(--slate-grey);">
        <span class="close-btn" onclick="closeBook('rules')">✕</span>
        <div class="notebook-content" style="background-color: var(--vanilla-cream);">
            <div id="rules-editor" class="editor" contenteditable="true" oninput="save('rules')"></div>
        </div>
        <div class="markers">
            <div class="marker" style="background: var(--muted-olive)" onclick="setColor('var(--muted-olive)')"></div>
            <div class="marker" style="background: var(--rosy-brown)" onclick="setColor('var(--rosy-brown)')"></div>
            <div class="marker" style="background: var(--dove-grey)" onclick="setColor('var(--dove-grey)')"></div>
            <div class="marker" style="background: black" onclick="setColor('black')"></div>
        </div>
    </div>

    <div id="notes-book" class="notebook" style="background-color: var(--mocha);">
        <span class="close-btn" onclick="closeBook('notes')">✕</span>
        <div class="notebook-content" style="background-color: var(--warm-cream);">
            <div id="notes-editor" class="editor" contenteditable="true" oninput="save('notes')"></div>
        </div>
        <div class="markers">
            <div class="marker" style="background: var(--muted-olive)" onclick="setColor('var(--muted-olive)')"></div>
            <div class="marker" style="background: var(--rosy-brown)" onclick="setColor('var(--rosy-brown)')"></div>
            <div class="marker" style="background: var(--dove-grey)" onclick="setColor('var(--dove-grey)')"></div>
            <div class="marker" style="background: black" onclick="setColor('black')"></div>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('WPI_Data')) || { en:[], kr:[], de:[] };
        let storage = JSON.parse(localStorage.getItem('WPI_Text')) || { rules:{en:"", kr:"", de:""}, notes:{en:"", kr:"", de:""} };
        let curL = 'en', curIdx = 0;

        function setLang(l) {
            curL = l; curIdx = 0;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('l-'+l).classList.add('active');
            update();
        }

        function update() {
            document.getElementById('card-inner').classList.remove('flipped');
            if (!data[curL][curIdx]) {
                document.getElementById('f').innerText = "Empty";
                document.getElementById('b').innerText = "Пусто";
            } else {
                document.getElementById('f').innerText = data[curL][curIdx].f;
                document.getElementById('b').innerText = data[curL][curIdx].b;
            }
        }

        function handleCardClick(e) {
            if(!e.target.classList.contains('delete-btn')) {
                document.getElementById('card-inner').classList.toggle('flipped');
            }
        }

        function add() {
            let f = document.getElementById('in-f').value, b = document.getElementById('in-b').value;
            if(f && b) {
                data[curL].push({f, b});
                localStorage.setItem('WPI_Data', JSON.stringify(data));
                document.getElementById('in-f').value = ''; document.getElementById('in-b').value = '';
                curIdx = data[curL].length - 1; update();
            }
        }

        function deleteWord(e) {
            data[curL].splice(curIdx, 1);
            localStorage.setItem('WPI_Data', JSON.stringify(data));
            curIdx = 0; update();
        }

        function openBook(type) {
            document.getElementById(type+'-book').style.display = 'flex';
            document.getElementById(type+'-editor').innerHTML = storage[type][curL];
        }

        function closeBook(type) { document.getElementById(type+'-book').style.display = 'none'; }

        function save(type) {
            storage[type][curL] = document.getElementById(type+'-editor').innerHTML;
            localStorage.setItem('WPI_Text', JSON.stringify(storage));
        }

        // КРАСИМ ВЫДЕЛЕННЫЙ ТЕКСТ
        function setColor(color) {
            document.execCommand('foreColor', false, color);
        }

        setLang('en');
    </script>
</body>
</html>
