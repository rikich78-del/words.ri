<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Words.ri</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chalk: #edeae5;
            --ancient-bonsai: #73754c;
            --muted-olive: #7c7E73;
            --rosy-brown: #913834;
            --dove-grey: #686775;
            --mocha: #4B3935;
            --vanilla-cream: #F0E7D5;
            --warm-cream: #FAF3E0;
            --slate-grey: #708090;
            --splash-bg: #FFF6DB;
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: #f8f8f8;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            color: var(--ancient-bonsai);
            overflow-x: hidden;
        }

        /* ЗАГРУЗОЧНЫЙ ЭКРАН */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--splash-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .splash-content { text-align: center; color: #F6983E; }
        .hand-star { width: 40px; height: 40px; fill: #FFE7B7; vertical-align: middle; }
        .splash-title { font-size: 42px; margin: 10px 0; font-weight: 900; display: inline-block; }
        
        .loader-bar {
            width: 180px; height: 18px;
            background: #485C8E; border-radius: 20px;
            margin: 25px auto; overflow: hidden;
            border: 2px solid #6F8AB7; position: relative;
        }
        .loader-progress {
            width: 0%; height: 100%;
            background: #F6983E;
            animation: loadProgress 2.2s forwards ease-in-out;
        }
        @keyframes loadProgress { to { width: 100%; } }
        .splash-hidden { opacity: 0; visibility: hidden; }

        /* ИНТЕРФЕЙС */
        .header { font-size: 32px; margin: 15px 0; font-weight: 900; }
        .lang-menu { display: flex; gap: 8px; margin-bottom: 15px; }
        .lang-btn {
            padding: 6px 14px; border: 1.5px solid var(--ancient-bonsai);
            background: white; border-radius: 8px; font-family: inherit;
            cursor: pointer; color: var(--ancient-bonsai);
            transition: transform 0.1s;
        }
        .lang-btn.active { background-color: #dcdcdc; }
        .lang-btn:active { transform: scale(0.95); }

        /* ГЛАВНАЯ ОБЛАСТЬ КАРТОЧКИ И СТРЕЛОК */
        .main-view {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .nav-arrow {
            background: var(--chalk);
            border: 1.5px solid var(--ancient-bonsai);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ancient-bonsai);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
            flex-shrink: 0;
        }
        .nav-arrow:active { transform: scale(0.9); }

        .card-container { width: 100%; max-width: 280px; height: 200px; perspective: 1000px; }
        .card { width: 100%; height: 100%; position: relative; transition: 0.6s; transform-style: preserve-3d; }
        .card.flipped { transform: rotateY(180deg); }
        .front, .back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 20px; background-color: var(--chalk); border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05); padding: 20px; box-sizing: border-box;
        }
        .back { transform: rotateY(180deg); }
        .word-text { font-size: 30px; text-align: center; word-break: break-word; }

        .add-area { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
        input { padding: 10px; width: 85px; border: 1px solid var(--ancient-bonsai); border-radius: 10px; background: var(--chalk); outline: none; font-family: inherit;}

        /* ТЕТРАДИ */
        .notebook {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; flex-direction: column; padding: 15px; box-sizing: border-box;
        }
        .notebook-content { flex-grow: 1; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        .editor { flex-grow: 1; outline: none; font-size: 18px; line-height: 1.6; overflow-y: auto; text-align: left; }
        .page-ctrl { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 10px; }
        .markers { display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1); }
        .marker { width: 30px; height: 30px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-content">
            <svg class="hand-star" viewBox="0 0 24 24"><path d="M12 2L14.5 9H22L16 14L18.5 21L12 17L5.5 21L8 14L2 9H9.5L12 2Z" stroke="#F6983E" stroke-width="1" fill="none"/></svg>
            <h1 class="splash-title">Words.ri</h1>
            <svg class="hand-star" viewBox="0 0 24 24"><path d="M12 2L14.5 9H22L16 14L18.5 21L12 17L5.5 21L8 14L2 9H9.5L12 2Z" stroke="#F6983E" stroke-width="1" fill="none"/></svg>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <div class="header">words.ri</div>

    <div class="lang-menu">
        <button class="lang-btn active" id="l-en" onclick="setLang('en')">Eng</button>
        <button class="lang-btn" id="l-kr" onclick="setLang('kr')">Kor</button>
        <button class="lang-btn" id="l-de" onclick="setLang('de')">Ger</button>
    </div>

    <button class="lang-btn" style="margin-bottom: 20px; border-radius: 20px;" onclick="shuffle()">mix words</button>

    <div class="main-view">
        <button class="nav-arrow" onclick="prevWord()">&#10094;</button>
        
        <div class="card-container" id="main-card-trigger">
            <div class="card" id="card-inner">
                <div class="front" onclick="flipCard()">
                    <div class="word-text" id="f">...</div>
                </div>
                <div class="back" onclick="flipCard()">
                    <div class="word-text" id="b">...</div>
                    <button style="position:absolute; bottom:15px; right:15px; background:none; border:none; cursor:pointer; font-size:22px;" onclick="deleteCurrentWord(event)">🗑️</button>
                </div>
            </div>
        </div>

        <button class="nav-arrow" onclick="nextWord()">&#10095;</button>
    </div>

    <div class="add-area">
        <span style="font-size:28px; cursor:pointer" onclick="openBook('rules')">📌</span>
        <span style="font-size:28px; cursor:pointer" onclick="openBook('notes')">📝</span>
        <input id="in-f" placeholder="word">
        <input id="in-b" placeholder="transl.">
        <button class="lang-btn" onclick="add()">+</button>
    </div>

    <div id="rules-book" class="notebook" style="background-color: var(--slate-grey);">
        <div style="display:flex; justify-content:space-between; color:white; margin-bottom:10px;">
            <b>Rules: <span id="r-title"></span></b>
            <button onclick="closeBook('rules')" style="background:none; border:none; color:white; font-size:20px;">✕</button>
        </div>
        <div class="notebook-content" style="background-color: var(--vanilla-cream);">
            <div class="page-ctrl">
                <button class="lang-btn" onclick="changePage('rules', -1)">←</button>
                <span id="rules-pg-num" style="color: #333">Стр. 1</span>
                <button class="lang-btn" onclick="changePage('rules', 1)">→</button>
            </div>
            <div id="rules-editor" class="editor" contenteditable="true" oninput="save('rules')"></div>
            <div class="markers">
                <div class="marker" style="background:var(--rosy-brown)" onclick="applyColor('var(--rosy-brown)')"></div>
                <div class="marker" style="background:var(--ancient-bonsai)" onclick="applyColor('var(--ancient-bonsai)')"></div>
                <div class="marker" style="background:#000" onclick="applyColor('#000')"></div>
            </div>
        </div>
    </div>

    <div id="notes-book" class="notebook" style="background-color: var(--mocha);">
        <div style="display:flex; justify-content:space-between; color:white; margin-bottom:10px;">
            <b>Notes: <span id="n-title"></span></b>
            <button onclick="closeBook('notes')" style="background:none; border:none; color:white; font-size:20px;">✕</button>
        </div>
        <div class="notebook-content" style="background-color: var(--warm-cream);">
            <div class="page-ctrl">
                <button class="lang-btn" onclick="changePage('notes', -1)">←</button>
                <span id="notes-pg-num" style="color: #333">Стр. 1</span>
                <button class="lang-btn" onclick="changePage('notes', 1)">→</button>
            </div>
            <div id="notes-editor" class="editor" contenteditable="true" oninput="save('notes')"></div>
            <div class="markers">
                <div class="marker" style="background:var(--rosy-brown)" onclick="applyColor('var(--rosy-brown)')"></div>
                <div class="marker" style="background:var(--ancient-bonsai)" onclick="applyColor('var(--ancient-bonsai)')"></div>
                <div class="marker" style="background:#000" onclick="applyColor('#000')"></div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация данных
        let data = JSON.parse(localStorage.getItem('wordsPI_v3')) || { 
            en:[{f:"Cloud",b:"Облако"}], kr:[], de:[] 
        };
        let storage = JSON.parse(localStorage.getItem('textPI_v3')) || { 
            rules:{en:[""],kr:[""],de:[""]}, notes:{en:[""],kr:[""],de:[""]} 
        };
        let curL = 'en', curIdx = 0, curPages = { rules: 0, notes: 0 };

        // Загрузка
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('splash-hidden');
            }, 2500);
            update();
        });

        function setLang(l) {
            curL = l; curIdx = 0;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('l-'+l).classList.add('active');
            update();
        }

        function update() {
            const card = document.getElementById('card-inner');
            card.classList.remove('flipped');
            
            if (!data[curL] || data[curL].length === 0) {
                document.getElementById('f').innerText = "Пусто";
                document.getElementById('b').innerText = "Добавь слово ниже";
                return;
            }

            // Защита от выхода за границы
            if (curIdx >= data[curL].length) curIdx = 0;
            if (curIdx < 0) curIdx = data[curL].length - 1;

            setTimeout(() => {
                document.getElementById('f').innerText = data[curL][curIdx].f;
                document.getElementById('b').innerText = data[curL][curIdx].b;
            }, 150);
        }

        // Переключение карточек
        function nextWord() { 
            if (data[curL].length > 0) {
                curIdx++; 
                update(); 
            }
        }
        function prevWord() { 
            if (data[curL].length > 0) {
                curIdx--; 
                update(); 
            }
        }

        function flipCard() { 
            document.getElementById('card-inner').classList.toggle('flipped'); 
        }

        function shuffle() { 
            if(data[curL].length > 0) {
                data[curL].sort(() => Math.random() - 0.5); 
                curIdx = 0; 
                update(); 
            }
        }

        function add() {
            let inf = document.getElementById('in-f'), inb = document.getElementById('in-b');
            let f = inf.value.trim(), b = inb.value.trim();
            if(f && b) {
                data[curL].push({f, b});
                localStorage.setItem('wordsPI_v3', JSON.stringify(data));
                inf.value = ''; inb.value = '';
                curIdx = data[curL].length - 1;
                update();
            }
        }

        function deleteCurrentWord(e) {
            e.stopPropagation();
            if(data[curL].length > 0 && confirm("Удалить это слово?")) {
                data[curL].splice(curIdx, 1);
                localStorage.setItem('wordsPI_v3', JSON.stringify(data));
                update();
            }
        }

        // Тетради
        function openBook(type) {
            document.getElementById(type+'-book').style.display = 'flex';
            document.getElementById(type==='rules'?'r-title':'n-title').innerText = curL.toUpperCase();
            loadPage(type);
        }
        function loadPage(type) {
            document.getElementById(type+'-editor').innerHTML = storage[type][curL][curPages[type]] || "";
            document.getElementById(type+'-pg-num').innerText = "Стр. " + (curPages[type]+1);
        }
        function changePage(type, dir) {
            save(type);
            curPages[type] = Math.max(0, curPages[type] + dir);
            if (!storage[type][curL][curPages[type]]) storage[type][curL][curPages[type]] = "";
            loadPage(type);
        }
        function closeBook(type) { save(type); document.getElementById(type+'-book').style.display = 'none'; }
        function save(type) {
            storage[type][curL][curPages[type]] = document.getElementById(type+'-editor').innerHTML;
            localStorage.setItem('textPI_v3', JSON.stringify(storage));
        }
        function applyColor(c) { document.execCommand('foreColor', false, c); }
    </script>
</body>
</html>
